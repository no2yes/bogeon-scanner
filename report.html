<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보건일지 보고서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #F7F5EF; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; max-width: 640px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 0 0 10px; }

  a.back-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; margin-bottom: 14px; border-radius: 999px; border: 1px solid #2F6F5E; background: #fff; font-size: 14px; font-weight: 600; color: #2F6F5E; text-decoration: none; }

  .field-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #1F2A24; margin-bottom: 6px; }
  input[type="date"], input[type="month"] {
    width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc;
    padding: 10px 12px; font-family: inherit; font-size: 15px; color: #1F2A24;
  }

  #reportTypeTabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-tab-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #fff;
    color: #666; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .type-tab-btn.active { background: #2F6F5E; border-color: #2F6F5E; color: #fff; }

  #generateBtn {
    display: block; width: 100%; box-sizing: border-box; padding: 14px;
    border-radius: 10px; border: none; background: #2F6F5E; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none; margin-top: 4px;
  }

  /* ── 주간 보고서(텍스트만) ── */
  #weeklyResultBox { display: none; }
  #resultText {
    width: 100%; box-sizing: border-box; min-height: 260px;
    background: #FAF9F5; border: 1px solid #eee; border-radius: 10px;
    padding: 14px; font-size: 15px; line-height: 1.7; white-space: pre-wrap;
    font-family: inherit; color: #1F2A24; resize: vertical;
  }
  .copy-btn {
    display: block; width: 100%; box-sizing: border-box; padding: 12px; margin-top: 10px;
    border-radius: 10px; border: 1px solid #2F6F5E; background: #fff; color: #2F6F5E;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }

  /* ── 월별 보고서(그래프 대시보드) ── */
  #monthlyResultBox { display: none; }
  .month-stat-cards { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .month-stat-card { flex: 1; min-width: 100px; box-sizing: border-box; background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px; text-align: center; }
  .month-stat-card .num { font-size: 24px; font-weight: 800; color: #2F6F5E; }
  .month-stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

  .chart-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .chart-box canvas { max-height: 260px; }

  .text-summary-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; }

  .big-spinner {
    width: 68px; height: 68px; border: 6px solid rgba(47, 111, 94, 0.12);
    border-top-color: #2F6F5E; border-radius: 50%; animation: bigspin 0.9s linear infinite;
  }
  @keyframes bigspin { to { transform: rotate(360deg); } }
  #loadingOverlay {
    position: fixed; inset: 0; background: rgba(247, 245, 239, 0.97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 700;
  }
  #loadingOverlay .loading-text { margin-top: 20px; font-size: 18px; font-weight: 700; color: #1F2A24; }

  /* 인쇄할 때는 버튼·입력창·탭 같은 조작용 요소를 다 숨기고, 결과 내용만 보여줍니다. */
  @media print {
    a.back-link, #reportTypeTabs, .field-box, .copy-btn, #loadingOverlay {
      display: none !important;
    }
    body { background: #fff; padding: 0; }
  }
</style>
</head>
<body>
  <a class="back-link" href="home.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    홈으로
  </a>

  <h1>보건일지 보고서</h1>

  <div id="reportTypeTabs">
    <button type="button" class="type-tab-btn active" id="tabWeekly">주간 보고서</button>
    <button type="button" class="type-tab-btn" id="tabMonthly">월별 보고서</button>
  </div>

  <div class="field-box">
    <div id="weeklyField">
      <label for="weekDate">이 주(그 주의 아무 날짜나 선택)</label>
      <input type="date" id="weekDate">
    </div>
    <div id="monthlyField" style="display:none;">
      <label for="monthPicker">보고 대상 월</label>
      <input type="month" id="monthPicker">
    </div>

    <button type="button" id="generateBtn" style="margin-top: 14px;">보고서 생성</button>
  </div>

  <!-- ── 주간 보고서 결과: 텍스트만 ── -->
  <div class="field-box" id="weeklyResultBox">
    <label>주간 보고서</label>
    <textarea id="resultText"></textarea>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button type="button" id="copyWeeklyBtn" class="copy-btn" style="margin-top:0;">📋 아래 내용 전체 복사</button>
      <button type="button" id="printWeeklyBtn" class="copy-btn" style="margin-top:0; border-color:#666; color:#666;">🖨️ 인쇄</button>
    </div>
  </div>

  <!-- ── 월별 보고서 결과: 그래프 대시보드 + 본문 요약(복사용) ── -->
  <div id="monthlyResultBox">
    <div class="month-stat-cards">
      <div class="month-stat-card"><div class="num" id="statTotal">–</div><div class="label">총 방문 건수</div></div>
      <div class="month-stat-card"><div class="num" id="statChildren">–</div><div class="label">방문 아동 수</div></div>
      <div class="month-stat-card"><div class="num" id="statAvg">–</div><div class="label">일평균 방문</div></div>
    </div>

    <div class="chart-box">
      <h2>📈 일별 방문 추이</h2>
      <canvas id="dailyChart"></canvas>
    </div>

    <div class="chart-box">
      <h2>🏆 아동별 방문 횟수 TOP 5</h2>
      <canvas id="childChart"></canvas>
    </div>

    <div class="chart-box">
      <h2>🩹 주요 증상 TOP 5</h2>
      <canvas id="symptomChart"></canvas>
    </div>

    <div class="text-summary-box">
      <label>보고서 본문(복사용 텍스트 요약)</label>
      <textarea id="monthlyResultText" style="width:100%; box-sizing:border-box; min-height:220px; background:#FAF9F5; border:1px solid #eee; border-radius:10px; padding:14px; font-size:15px; line-height:1.7; white-space:pre-wrap; font-family:inherit; color:#1F2A24; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button type="button" id="copyMonthlyBtn" class="copy-btn" style="margin-top:0;">📋 보고서 본문 복사</button>
        <button type="button" id="printMonthlyBtn" class="copy-btn" style="margin-top:0; border-color:#666; color:#666;">🖨️ 전체 인쇄</button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="big-spinner"></div>
    <div class="loading-text">불러오고 있어요...</div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXl1dyqmCh0umvMr-8wjy74n0488S7z6BJOtsLzNC6N3wKNc98AKD2irMal1EpNFn-/exec';

    var reportType = 'weekly';
    var dailyChartInstance = null;
    var childChartInstance = null;
    var symptomChartInstance = null;

    var tabWeekly = document.getElementById('tabWeekly');
    var tabMonthly = document.getElementById('tabMonthly');
    var weeklyField = document.getElementById('weeklyField');
    var monthlyField = document.getElementById('monthlyField');

    function pad2(n) { return String(n).padStart(2, '0'); }
    function formatDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

    var today = new Date();
    document.getElementById('weekDate').value = formatDateStr(today);
    document.getElementById('monthPicker').value = today.getFullYear() + '-' + pad2(today.getMonth() + 1);

    tabWeekly.addEventListener('click', function () {
      reportType = 'weekly';
      tabWeekly.classList.add('active');
      tabMonthly.classList.remove('active');
      weeklyField.style.display = 'block';
      monthlyField.style.display = 'none';
      document.getElementById('monthlyResultBox').style.display = 'none';
    });
    tabMonthly.addEventListener('click', function () {
      reportType = 'monthly';
      tabMonthly.classList.add('active');
      tabWeekly.classList.remove('active');
      weeklyField.style.display = 'none';
      monthlyField.style.display = 'block';
      document.getElementById('weeklyResultBox').style.display = 'none';
    });

    function getWeekRange(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      var day = d.getDay();
      var diffToMonday = (day === 0 ? -6 : 1 - day);
      var monday = new Date(d);
      monday.setDate(d.getDate() + diffToMonday);
      var sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { start: formatDateStr(monday), end: formatDateStr(sunday), startObj: monday, endObj: sunday };
    }

    function getMonthRange(monthStr) {
      var parts = monthStr.split('-');
      var year = parseInt(parts[0], 10);
      var month = parseInt(parts[1], 10);
      var startObj = new Date(year, month - 1, 1);
      var lastDay = new Date(year, month, 0).getDate();
      var endObj = new Date(year, month - 1, lastDay);
      return { start: formatDateStr(startObj), end: formatDateStr(endObj), startObj: startObj, endObj: endObj, year: year, month: month, lastDay: lastDay };
    }

    var weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
    function formatKoreanDate(d) {
      return (d.getMonth() + 1) + '.' + d.getDate() + '(' + weekdayNames[d.getDay()] + ')';
    }

    document.getElementById('generateBtn').addEventListener('click', function () {
      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('generateBtn').disabled = true;

      if (reportType === 'weekly') {
        generateWeeklyReport();
      } else {
        generateMonthlyReport();
      }
    });

    function generateWeeklyReport() {
      var weekDateVal = document.getElementById('weekDate').value;
      if (!weekDateVal) { alert('날짜를 선택해 주세요.'); finishLoading(); return; }
      var range = getWeekRange(weekDateVal);
      var periodLabel = formatKoreanDate(range.startObj) + ' ~ ' + formatKoreanDate(range.endObj);

      fetch(GAS_URL + '?action=periodReport&start=' + range.start + '&end=' + range.end)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          finishLoading();
          var reportText = buildTextSummary(periodLabel, data);
          document.getElementById('resultText').value = reportText;
          document.getElementById('weeklyResultBox').style.display = 'block';
          document.getElementById('weeklyResultBox').scrollIntoView({ behavior: 'smooth' });
        })
        .catch(function () {
          finishLoading();
          alert('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        });
    }

    function generateMonthlyReport() {
      var monthVal = document.getElementById('monthPicker').value;
      if (!monthVal) { alert('월을 선택해 주세요.'); finishLoading(); return; }
      var range = getMonthRange(monthVal);
      var periodLabel = range.year + '년 ' + range.month + '월';

      fetch(GAS_URL + '?action=periodReport&start=' + range.start + '&end=' + range.end)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          finishLoading();
          renderMonthlyDashboard(range, data);
          document.getElementById('monthlyResultText').value = buildTextSummary(periodLabel, data);
          document.getElementById('monthlyResultBox').style.display = 'block';
          document.getElementById('monthlyResultBox').scrollIntoView({ behavior: 'smooth' });
        })
        .catch(function () {
          finishLoading();
          alert('불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        });
    }

    function finishLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
    }

    // 서버가 준 방문 목록·아동별 건수로 통계 카드 + 두 개의 그래프를 그립니다.
    function renderMonthlyDashboard(range, data) {
      // 일별 방문 건수를 계산합니다 (1일 ~ 그 달 마지막 날까지).
      var dailyCounts = new Array(range.lastDay).fill(0);
      data.items.forEach(function (item) {
        var day = parseInt(item.visitDateTime.substring(8, 10), 10);
        if (day >= 1 && day <= range.lastDay) dailyCounts[day - 1]++;
      });
      var dayLabels = [];
      for (var d = 1; d <= range.lastDay; d++) dayLabels.push(d + '일');

      // 통계 카드
      var uniqueChildren = Object.keys(data.childCounts).length;
      document.getElementById('statTotal').textContent = data.count;
      document.getElementById('statChildren').textContent = uniqueChildren;
      document.getElementById('statAvg').textContent = (data.count / range.lastDay).toFixed(1);

      // 그래프 1: 일별 방문 추이 (막대그래프)
      if (dailyChartInstance) dailyChartInstance.destroy();
      dailyChartInstance = new Chart(document.getElementById('dailyChart'), {
        type: 'bar',
        data: {
          labels: dayLabels,
          datasets: [{
            label: '방문 건수',
            data: dailyCounts,
            backgroundColor: '#2F6F5E'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      // 그래프 2: 아동별 방문 횟수 TOP 5 (가로 막대그래프)
      var childEntries = Object.keys(data.childCounts).map(function (name) {
        return { name: name, count: data.childCounts[name] };
      });
      childEntries.sort(function (a, b) { return b.count - a.count; });
      var top5 = childEntries.slice(0, 5);

      if (childChartInstance) childChartInstance.destroy();
      childChartInstance = new Chart(document.getElementById('childChart'), {
        type: 'bar',
        data: {
          labels: top5.map(function (c) { return c.name; }),
          datasets: [{
            label: '방문 횟수',
            data: top5.map(function (c) { return c.count; }),
            backgroundColor: '#B7791F'
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      // 그래프 3: 주요 증상 TOP 5 — AI가 분류를 마칠 때까지는 빈 상태로 먼저
      // 그려두고, 응답이 오면 아래에서 채워 넣습니다.
      if (symptomChartInstance) symptomChartInstance.destroy();
      symptomChartInstance = new Chart(document.getElementById('symptomChart'), {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '건수', data: [], backgroundColor: '#DC2626' }] },
        options: {
          indexAxis: 'y', responsive: true,
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      var symptoms = data.items.map(function (item) { return item.symptom || ''; }).filter(function (s) { return s; });
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'symptomTop5', symptoms: symptoms })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result && result.ok && result.top5 && result.top5.length > 0) {
            symptomChartInstance.data.labels = result.top5.map(function (t) { return t.category; });
            symptomChartInstance.data.datasets[0].data = result.top5.map(function (t) { return t.count; });
            symptomChartInstance.update();
          } else {
            document.querySelector('#symptomChart').parentElement.querySelector('h2').textContent =
              '🩹 주요 증상 TOP 5 (분류 실패)';
          }
        })
        .catch(function () {
          document.querySelector('#symptomChart').parentElement.querySelector('h2').textContent =
            '🩹 주요 증상 TOP 5 (분류 실패)';
        });
    }

    // 개조식 텍스트 요약 (주간·월별 공통으로 씁니다)
    function buildTextSummary(periodLabel, data) {
      var lines = [];
      lines.push('○ 보고기간: ' + periodLabel);
      lines.push('○ 총 방문 건수: ' + data.count + '건');

      var childEntries = Object.keys(data.childCounts).map(function (name) {
        return { name: name, count: data.childCounts[name] };
      });
      childEntries.sort(function (a, b) { return b.count - a.count; });

      lines.push('○ 아동별 방문 현황:');
      if (childEntries.length === 0) {
        lines.push('  - 해당 기간 방문 기록이 없습니다.');
      } else {
        childEntries.forEach(function (c) {
          lines.push('  - ' + c.name + ' ' + c.count + '회');
        });
      }

      lines.push('○ 세부 내역:');
      if (data.items.length === 0) {
        lines.push('  - 없음');
      } else {
        data.items.forEach(function (item) {
          var shortTime = item.visitDateTime.replace(/^\d{4}\./, '');
          lines.push('  ' + shortTime + ' - ' + item.childName + ' - ' + (item.symptom || '(내용 없음)'));
        });
      }

      return lines.join('\n');
    }

    function setupCopyButton(btnId, textareaId) {
      document.getElementById(btnId).addEventListener('click', function () {
        var textEl = document.getElementById(textareaId);
        navigator.clipboard.writeText(textEl.value).then(function () {
          var btn = document.getElementById(btnId);
          var original = btn.textContent;
          btn.textContent = '복사됨!';
          setTimeout(function () { btn.textContent = original; }, 1200);
        });
      });
    }
    setupCopyButton('copyWeeklyBtn', 'resultText');
    setupCopyButton('copyMonthlyBtn', 'monthlyResultText');

    // 인쇄 버튼은 그냥 브라우저 기본 인쇄 기능을 그대로 씁니다.
    // 어느 쪽 결과 화면이 지금 보이는지는 이미 display 속성으로 정해져 있으니,
    // 인쇄 시 CSS(@media print)가 버튼·입력창만 숨기고 나머지는 그대로 인쇄합니다.
    document.getElementById('printWeeklyBtn').addEventListener('click', function () {
      window.print();
    });
    document.getElementById('printMonthlyBtn').addEventListener('click', function () {
      window.print();
    });
  </script>
</body>
</html>
