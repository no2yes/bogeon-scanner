<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보건일지 작성</title>
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 4px; }

  a.back-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; margin-bottom: 14px; border-radius: 999px; border: 1px solid #2F6F5E; background: #fff; font-size: 14px; font-weight: 600; color: #2F6F5E; text-decoration: none; }

  .field-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #1F2A24; margin-bottom: 6px; }
  input[type="text"], textarea {
    width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc;
    padding: 10px 12px; font-family: inherit; font-size: 15px; color: #1F2A24;
  }
  input[readonly] { background: #F5F5F0; color: #666; }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }

  .guide-box {
    background: #EAF2EE; border-radius: 10px; padding: 12px 14px;
    font-size: 13px; color: #2F6F5E; line-height: 1.5; margin-bottom: 12px;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  #outputBtn {
    flex: 2; box-sizing: border-box; padding: 14px;
    border-radius: 10px; border: none; background: #2F6F5E; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }

  #resultBox { display: none; }
  #resultText {
    width: 100%; box-sizing: border-box; min-height: 160px;
    background: #FAF9F5; border: 1px solid #eee; border-radius: 10px;
    padding: 14px; font-size: 15px; line-height: 1.7; white-space: pre-wrap;
    font-family: inherit; color: #1F2A24; resize: vertical;
  }
  #copyBtn {
    flex: 1; box-sizing: border-box; padding: 14px;
    border-radius: 10px; border: 1px solid #2F6F5E; background: #fff; color: #2F6F5E;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  #copyBtn:disabled { border-color: #ccc; color: #aaa; cursor: not-allowed; }

  .big-spinner {
    width: 68px; height: 68px; border: 6px solid rgba(47, 111, 94, 0.12);
    border-top-color: #2F6F5E; border-radius: 50%; animation: bigspin 0.9s linear infinite;
  }
  @keyframes bigspin { to { transform: rotate(360deg); } }
  #loadingOverlay {
    position: fixed; inset: 0; background: rgba(247, 245, 239, 0.97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 700;
  }
  #loadingOverlay .loading-text { margin-top: 20px; font-size: 18px; font-weight: 700; color: #1F2A24; }
</style>
</head>
<body>
  <a class="back-link" href="home.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    홈으로
  </a>

  <h1>보건일지 작성</h1>

  <div class="field-box">
    <label for="visitTime">방문일시</label>
    <input type="text" id="visitTime" readonly>

    <div class="field-row" style="margin-top: 14px;">
      <div>
        <label for="childName">대상아동</label>
        <input type="text" id="childName" placeholder="예: 홍길동" tabindex="1">
      </div>
      <div>
        <label for="author">작성자</label>
        <input type="text" id="author" value="동영" tabindex="3">
      </div>
    </div>

    <label for="rawText" style="margin-top: 14px;">내용</label>
    <div class="guide-box">
      💡 편하게 있었던 일 그대로 적어주세요.<br>
      예: "철수가 놀다가 넘어져서 무릎이 까졌어요. 소독하고 밴드 붙여줬어요." → AI가 자동으로 보고서 형식에 맞게 정리해드려요.
    </div>
    <textarea id="rawText" placeholder="있었던 일을 자유롭게 적어주세요" tabindex="2"></textarea>

    <div class="btn-row">
      <button type="button" id="outputBtn" tabindex="4">저장</button>
      <button type="button" id="copyBtn" tabindex="5" disabled>📋 요약보고서 복사</button>
    </div>
  </div>

  <div class="field-box" id="resultBox">
    <label>정리된 보고서 <span id="aiBadge"></span></label>
    <textarea id="resultText"></textarea>
  </div>

  <div id="loadingOverlay">
    <div class="big-spinner"></div>
    <div class="loading-text">AI가 정리하고 있어요...</div>
  </div>

  <script>
    // ▼▼ 보건실 관리시스템 Apps Script 웹 앱의 실제 exec 주소로 바꿔주세요 (다른 파일들과 동일한 주소) ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXl1dyqmCh0umvMr-8wjy74n0488S7z6BJOtsLzNC6N3wKNc98AKD2irMal1EpNFn-/exec';

    // 방문일시를 "2026.09.25.(금) 13:40" 형태로 자동으로 채웁니다.
    var weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
    var now = new Date();
    var visitDateTimeStr =
      now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' +
      String(now.getDate()).padStart(2, '0') + '.(' + weekdayNames[now.getDay()] + ') ' +
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.getElementById('visitTime').value = visitDateTimeStr;

    var childNameInput = document.getElementById('childName');
    var authorInput = document.getElementById('author');
    var rawTextInput = document.getElementById('rawText');
    var outputBtn = document.getElementById('outputBtn');
    var resultBox = document.getElementById('resultBox');
    var resultText = document.getElementById('resultText');
    var loadingOverlay = document.getElementById('loadingOverlay');

    // 아직 저장 전이면 null, 한 번 저장하고 나면 그 줄의 시트 행 번호가 들어갑니다.
    // 이 값이 있으면 "수정 내용 저장"(업데이트) 모드로 동작합니다.
    var savedRowIndex = null;

    // 페이지를 열면 바로 대상아동 이름부터 입력할 수 있게 포커스를 줍니다.
    childNameInput.focus();

    outputBtn.addEventListener('click', function () {
      // 아직 저장 전이면(=처음 누르는 거면) 새로 만들고, 이미 저장된 뒤라면
      // (=savedRowIndex가 있으면) 고친 내용으로 그 줄만 업데이트합니다.
      if (savedRowIndex === null) {
        createNursingLog();
      } else {
        updateNursingLog();
      }
    });

    function createNursingLog() {
      if (!childNameInput.value.trim()) {
        alert('대상 아동 이름을 입력해 주세요.');
        return;
      }
      if (!rawTextInput.value.trim()) {
        alert('내용을 입력해 주세요.');
        return;
      }

      loadingOverlay.style.display = 'flex';
      outputBtn.disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'nursingLog',
          visitDateTime: visitDateTimeStr,
          childName: childNameInput.value.trim(),
          author: authorInput.value.trim(),
          rawText: rawTextInput.value.trim()
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          loadingOverlay.style.display = 'none';
          outputBtn.disabled = false;

          if (data && data.ok) {
            resultText.value = data.report;
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth' });
            document.getElementById('copyBtn').disabled = false;

            // AI가 정상적으로 정리했으면 ✨, 실패해서 대체 문구가 들어간 거면
            // ⚠️로 표시해서, 한 번 더 검토가 필요한지 바로 알 수 있게 합니다.
            var badge = document.getElementById('aiBadge');
            badge.textContent = data.aiUsed ? '✨' : '⚠️';
            badge.title = data.aiUsed ? 'AI가 정상적으로 정리했어요' : 'AI 정리에 실패해 확인 문구가 들어갔어요 — 꼭 검토해 주세요';

            // 저장이 끝났으니, 이제부터는 "수정 내용 저장" 모드로 전환합니다.
            savedRowIndex = data.rowIndex;
            outputBtn.textContent = '수정 내용 저장';
          } else {
            alert('정리 실패: ' + (data && data.error ? data.error : '알 수 없는 오류'));
          }
        })
        .catch(function () {
          loadingOverlay.style.display = 'none';
          outputBtn.disabled = false;
          alert('전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        });
    }

    function updateNursingLog() {
      if (!resultText.value.trim()) {
        alert('저장할 내용이 없습니다.');
        return;
      }

      loadingOverlay.style.display = 'flex';
      outputBtn.disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'updateNursingLog',
          rowIndex: savedRowIndex,
          report: resultText.value.trim()
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          loadingOverlay.style.display = 'none';
          outputBtn.disabled = false;

          if (data && data.ok) {
            var badge = document.getElementById('aiBadge');
            badge.textContent = '✏️';
            badge.title = '직접 수정한 내용이에요';

            var original = outputBtn.textContent;
            outputBtn.textContent = '저장됨 ✓';
            setTimeout(function () { outputBtn.textContent = original; }, 1200);
          } else {
            alert('저장 실패: ' + (data && data.error ? data.error : '알 수 없는 오류'));
          }
        })
        .catch(function () {
          loadingOverlay.style.display = 'none';
          outputBtn.disabled = false;
          alert('전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        });
    }

    document.getElementById('copyBtn').addEventListener('click', function () {
      navigator.clipboard.writeText(resultText.value).then(function () {
        var btn = document.getElementById('copyBtn');
        var original = btn.textContent;
        btn.textContent = '복사됨!';
        setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  </script>
</body>
</html>
