<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사용법</title>
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #F7F5EF; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; max-width: 640px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }

  a.back-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; margin-bottom: 14px; border-radius: 999px; border: 1px solid #2F6F5E; background: #fff; font-size: 14px; font-weight: 600; color: #2F6F5E; text-decoration: none; }

  .search-box { display: flex; gap: 8px; margin-bottom: 8px; }
  #searchInput {
    flex: 1; box-sizing: border-box; border-radius: 10px; border: 1px solid #ccc;
    padding: 12px 14px; font-family: inherit; font-size: 15px;
  }
  #searchBtn {
    flex-shrink: 0; padding: 0 18px; border-radius: 10px; border: none;
    background: #2F6F5E; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  #searchStatus { font-size: 12px; color: #888; margin-bottom: 8px; min-height: 16px; }
  #searchAnswerBox {
    display: none; background: #EAF2EE; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 16px; font-size: 14px; line-height: 1.6; color: #1F2A24;
  }
  #searchAnswerSource {
    display: inline-block; margin-top: 10px; font-size: 12px; color: #2F6F5E;
    font-weight: 600; cursor: pointer; text-decoration: underline;
  }

  .faq-item { background: #fff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .faq-question {
    width: 100%; box-sizing: border-box; padding: 14px 16px; text-align: left;
    background: #fff; border: none; font-size: 15px; font-weight: 600; color: #1F2A24;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: space-between;
    -webkit-appearance: none; appearance: none;
  }
  .faq-question .arrow { flex-shrink: 0; transition: transform 0.2s; color: #2F6F5E; }
  .faq-item.open .faq-question .arrow { transform: rotate(180deg); }
  .faq-item.open .faq-question { background: #EAF2EE; }
  .faq-answer {
    display: none; padding: 0 16px 16px; font-size: 14px; line-height: 1.7; color: #444;
  }
  .faq-item.open .faq-answer { display: block; }
  .faq-item.highlight { border-color: #2F6F5E; box-shadow: 0 0 0 2px rgba(47,111,94,0.15); }
</style>
</head>
<body>
  <a class="back-link" href="home.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    홈으로
  </a>

  <h1>사용법</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="궁금한 걸 편하게 물어보세요 (예: 약 버리는 법이 뭐예요?)">
    <button type="button" id="searchBtn">검색</button>
  </div>
  <div id="searchStatus"></div>
  <div id="searchAnswerBox">
    <div id="searchAnswerText"></div>
    <div id="searchAnswerSource" style="display:none;"></div>
  </div>
  <div id="faqList"></div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXl1dyqmCh0umvMr-8wjy74n0488S7z6BJOtsLzNC6N3wKNc98AKD2irMal1EpNFn-/exec';
    var faqData = [];

    function renderFaqList() {
      var listEl = document.getElementById('faqList');
      listEl.innerHTML = '';

      faqData.forEach(function (item, index) {
        var el = document.createElement('div');
        el.className = 'faq-item';
        el.id = 'faq-' + index;
        el.innerHTML =
          '<button type="button" class="faq-question">' +
          '<span>' + item.q + '</span>' +
          '<span class="arrow">▾</span>' +
          '</button>' +
          '<div class="faq-answer"></div>';

        el.querySelector('.faq-answer').textContent = item.a;

        el.querySelector('.faq-question').addEventListener('click', function () {
          var isOpen = el.classList.contains('open');
          // 아코디언: 열려던 게 아니면(다른 걸 열려는 거면) 전부 닫고 이것만 엽니다.
          document.querySelectorAll('.faq-item').forEach(function (other) {
            other.classList.remove('open');
          });
          if (!isOpen) el.classList.add('open');
        });

        listEl.appendChild(el);
      });
    }

    fetch(GAS_URL + '?action=manualFaq')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        faqData = data;
        renderFaqList();
      })
      .catch(function () {
        document.getElementById('faqList').textContent = '불러오지 못했습니다.';
      });

    function runSearch() {
      var question = document.getElementById('searchInput').value.trim();
      if (!question) return;

      var statusEl = document.getElementById('searchStatus');
      var answerBox = document.getElementById('searchAnswerBox');
      var answerText = document.getElementById('searchAnswerText');
      var answerSource = document.getElementById('searchAnswerSource');

      statusEl.textContent = 'AI가 답변을 준비하고 있어요...';
      answerBox.style.display = 'none';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'manualSearch', question: question })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          document.querySelectorAll('.faq-item').forEach(function (el) {
            el.classList.remove('open', 'highlight');
          });

          if (data && data.ok) {
            statusEl.textContent = '';
            answerText.textContent = data.answer;
            answerBox.style.display = 'block';

            if (data.sourceIndex > 0) {
              var faqItem = faqData[data.sourceIndex - 1];
              answerSource.textContent = '📖 근거: ' + faqItem.q;
              answerSource.style.display = 'inline-block';
              answerSource.onclick = function () {
                var target = document.getElementById('faq-' + (data.sourceIndex - 1));
                target.classList.add('open', 'highlight');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(function () { target.classList.remove('highlight'); }, 2000);
              };
            } else {
              answerSource.style.display = 'none';
            }
          } else {
            statusEl.textContent = '검색에 실패했습니다: ' + (data && data.error ? data.error : '알 수 없는 오류');
          }
        })
        .catch(function () {
          statusEl.textContent = '검색 중 오류가 발생했습니다.';
        });
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('searchInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runSearch();
    });
  </script>
</body>
</html>
