<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약품 바코드 등록</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #666; }
  #reader { width: 100%; max-width: 420px; margin: 16px auto; border-radius: 10px; overflow: hidden; }
  #status { font-size: 13px; color: #666; margin-top: 8px; }
  #form { display: none; margin-top: 16px; padding: 16px; background: #fff; border: 1px solid #ddd; border-radius: 10px; }
  #form label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  #form label:first-child { margin-top: 0; }
  #form input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
  /* 아이폰 사파리에서 날짜 입력칸이 유독 크게 그려지는 걸 막아, 다른 입력칸과 크기를 맞춥니다 */
  #form input[type="date"] { -webkit-appearance: none; appearance: none; line-height: 44px; }
  #form input[readonly] { background: #F5F5F0; color: #666; }
  #saveBtn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2F6F5E; color: #fff; font-size: 15px; font-weight: 600; margin-top: 16px; }
  .qty-preset-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #1F2A24; font-size: 14px; }
  .year-jump-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #1F2A24; font-size: 14px; }
  #restart { width: 100%; padding: 10px; border-radius: 8px; border: none; background: transparent; color: #666; font-size: 13px; margin-top: 8px; display: none; }
  /* 화면 전체를 덮는 반투명 배경. z-index를 높게 줘서 다른 요소보다 위에 뜨게 합니다. */
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(247, 245, 239, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  /* 빙글빙글 도는 원형 스피너. 테두리 한쪽만 색을 다르게 줘서,
     회전 애니메이션을 걸면 그 부분만 도는 것처럼 보입니다. */
  .spinner {
    width: 56px;
    height: 56px;
    border: 5px solid rgba(47, 111, 94, 0.15);
    border-top-color: #2F6F5E;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    margin-top: 16px;
    font-size: 17px;
    font-weight: 600;
    color: #1F2A24;
  }
</style>
</head>
<body>
    <!-- 자동조회 중일 때 화면 전체를 덮는 로딩 표시입니다. 평소엔 숨겨져 있다가,
       조회를 시작할 때만 보이게 켭니다. -->
  <div id="loadingOverlay" style="display: none;">
    <div class="spinner"></div>
    <div class="loading-text">약품 정보를 찾고 있어요...</div>
  </div>
  <h1>약품 바코드 등록</h1>
  <p id="status">카메라 권한을 요청합니다...</p>
  <div id="reader"></div>

  <div id="form">
    <!-- 바코드·업체명·약품규격은 확인용 정보라 작은 한 줄로 요약해서 보여주고,
         실제 값은 화면에 안 보이는 hidden input에 담아 저장 시 그대로 씁니다. -->
    <div id="metaLine" style="font-size: 12px; color: #888; margin-bottom: 10px; word-break: break-all;"></div>
    <input type="hidden" id="barcode">
    <input type="hidden" id="company">
    <input type="hidden" id="spec">

    <label for="name">약품명</label>
    <input id="name" type="text" placeholder="예: 타이레놀 시럽">

    <!-- 내용량과 수량을 한 줄에 나란히 배치해서 세로 공간을 아낍니다 -->
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label for="quantity">내용량</label>
        <input id="quantity" type="text" placeholder="예: 10캡슐">
      </div>
      <div style="flex: 1;">
        <label for="stockQty">수량</label>
        <input id="stockQty" type="number" min="1" value="1">
      </div>
    </div>

    <!-- 자주 쓰는 수량을 버튼으로 눌러서 바로 채울 수 있게 합니다 -->
    <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
      <button type="button" class="qty-preset-btn" data-qty="1">1</button>
      <button type="button" class="qty-preset-btn" data-qty="3">3</button>
      <button type="button" class="qty-preset-btn" data-qty="5">5</button>
      <button type="button" class="qty-preset-btn" data-qty="10">10</button>
      <button type="button" class="qty-preset-btn" data-qty="15">15</button>
      <button type="button" class="qty-preset-btn" data-qty="20">20</button>
    </div>

    <label for="expiry">유통기한</label>
    <input id="expiry" type="date">

    <!-- 유통기한이 보통 지금으로부터 1~3년 뒤인 경우가 많아서,
         달력을 한 달씩 넘기지 않고 버튼 한 번으로 몇 년 뒤로 바로 이동할 수 있게 합니다. -->
    <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
      <button type="button" class="year-jump-btn" data-years="1">+1년</button>
      <button type="button" class="year-jump-btn" data-years="2">+2년</button>
      <button type="button" class="year-jump-btn" data-years="3">+3년</button>
    </div>

    <button id="saveBtn">저장</button>
  </div>
  <button id="restart">다시 스캔</button>

  <script>
    // ▼▼ 실제 배포된 Apps Script 웹 앱 URL ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyXl1dyqmCh0umvMr-8wjy74n0488S7z6BJOtsLzNC6N3wKNc98AKD2irMal1EpNFn-/exec';

    var statusEl = document.getElementById('status');
    var formEl = document.getElementById('form');
    var restartBtn = document.getElementById('restart');
            var barcodeInput = document.getElementById('barcode');
    var nameInput = document.getElementById('name');
    var companyInput = document.getElementById('company'); // 업체명 (자동조회, 읽기전용)
    var specInput = document.getElementById('spec');       // 약품규격 (자동조회, 읽기전용)
    var quantityInput = document.getElementById('quantity'); // 내용량(한 박스당) 입력칸
    var stockQtyInput = document.getElementById('stockQty'); // 수량(몇 개 있는지) 입력칸
    var expiryInput = document.getElementById('expiry');
    var saveBtn = document.getElementById('saveBtn');
    var html5QrCode;

    // 코드·업체명·규격을 한 줄짜리 요약 문구로 합쳐서 metaLine에 표시합니다.
    // 값이 없는 항목(예: 아직 조회가 안 된 규격)은 건너뛰고 " · "로만 구분해서 이어붙입니다.
    function updateMetaLine() {
      var parts = [];
      if (barcodeInput.value) parts.push('코드 ' + barcodeInput.value);
      if (companyInput.value) parts.push(companyInput.value);
      if (specInput.value) parts.push(specInput.value);
      document.getElementById('metaLine').textContent = parts.join(' · ');
    }

    function onScanSuccess(decodedText) {
      barcodeInput.value = decodedText;
      nameInput.value = '';
      companyInput.value = '';
      specInput.value = '';
      expiryInput.value = '';
      stockQtyInput.value = '1'; // 매번 새로 스캔할 때는 일단 1개로 시작 (필요하면 직접 수정)
      updateMetaLine(); // 코드만 있는 상태로 일단 한 번 표시
      html5QrCode.stop().then(function () {
        formEl.style.display = 'block';
        restartBtn.style.display = 'block';

        // 조회를 시작하기 전에 화면 전체를 덮는 로딩 표시를 켭니다.
        document.getElementById('loadingOverlay').style.display = 'flex';

        fetch(GAS_URL + '?action=lookup&barcode=' + encodeURIComponent(decodedText))
          .then(function (res) { return res.json(); })
          .then(function (data) {
            // 응답을 받았으니 로딩 표시를 끕니다.
            document.getElementById('loadingOverlay').style.display = 'none';

            if (data && data.found && data.name) {
              nameInput.value = data.name;
              companyInput.value = data.company || '';
              specInput.value = data.spec || '';
              quantityInput.value = data.quantity || '';
              updateMetaLine(); // 업체명·규격까지 채워졌으니 요약줄을 다시 갱신
              statusEl.textContent = '약품 정보를 자동으로 채웠어요 — 맞는지 확인 후 저장해 주세요.';
            } else {
              var debugInfo = (data && (data.debug || data.error)) ? (data.debug || data.error) : '응답 없음 (진짜로 못 찾은 것)';
              statusEl.textContent = '자동조회로 못 찾았어요 — 약품명을 직접 입력해 주세요. [디버그: ' + debugInfo + ']';
            }
            nameInput.focus();
          })
          .catch(function () {
            // 통신 자체가 실패한 경우에도 로딩 표시를 꺼줘야, 화면이 멈춘 것처럼 안 보입니다.
            document.getElementById('loadingOverlay').style.display = 'none';
            statusEl.textContent = '자동조회 실패 — 약품명을 직접 입력해 주세요.';
            nameInput.focus();
          });
      });
    }

    function startScanning() {
      formEl.style.display = 'none';
      restartBtn.style.display = 'none';
      html5QrCode = new Html5Qrcode('reader');
      var config = {
        fps: 10,
        qrbox: { width: 260, height: 260 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.RSS_14,
          Html5QrcodeSupportedFormats.RSS_EXPANDED,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };
      html5QrCode.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess
      ).then(function () {
        statusEl.textContent = '카메라 작동 중 — 바코드를 화면에 비춰주세요.';
      }).catch(function (err) {
        statusEl.textContent = '카메라 접근 실패: ' + err;
      });
    }
    // 수량 버튼을 누르면 그 숫자를 수량 칸에 바로 채워줍니다.
    document.querySelectorAll('.qty-preset-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        stockQtyInput.value = btn.getAttribute('data-qty');
      });
    });
        // "+1년" 버튼 등을 누르면, 오늘 날짜를 기준으로 몇 년 뒤 날짜를 계산해서
    // 유통기한 칸에 바로 채워줍니다. (예: 오늘이 2026-09-21이면 "+3년" → 2029-09-21)
    document.querySelectorAll('.year-jump-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var yearsToAdd = parseInt(btn.getAttribute('data-years'), 10);
        var targetDate = new Date();
        targetDate.setFullYear(targetDate.getFullYear() + yearsToAdd);

        // input type="date"는 정확히 "YYYY-MM-DD" 형식의 문자열을 요구하므로,
        // 월과 일이 한 자리 숫자일 때 앞에 0을 붙여서 두 자리로 맞춰줍니다.
        var yyyy = targetDate.getFullYear();
        var mm = String(targetDate.getMonth() + 1).padStart(2, '0');
        var dd = String(targetDate.getDate()).padStart(2, '0');

        expiryInput.value = yyyy + '-' + mm + '-' + dd;
      });
    });
    saveBtn.addEventListener('click', function () {
      if (!nameInput.value.trim()) {
        alert('약품명을 입력해 주세요.');
        return;
      }
      saveBtn.disabled = true;
      statusEl.textContent = '저장 중...';
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                             body: JSON.stringify({
          barcode: barcodeInput.value,
          name: nameInput.value.trim(),
          company: companyInput.value.trim(),
          spec: specInput.value.trim(),
          contentAmount: quantityInput.value.trim(),  // 내용량 (예: 10캡슐)
          stockQty: stockQtyInput.value.trim(),        // 수량 (몇 개 있는지)
          expiry: expiryInput.value
        })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        saveBtn.disabled = false;
        if (data && data.ok) {
          statusEl.textContent = '저장 완료! 다음 약품을 스캔하시거나 창을 닫으세요.';
          formEl.style.display = 'none';
          startScanning();
        } else {
          statusEl.textContent = '저장 실패: ' + (data && data.error ? data.error : '알 수 없는 오류');
        }
      })
      .catch(function (err) {
        saveBtn.disabled = false;
        statusEl.textContent = '전송 실패: ' + err;
      });
    });

    restartBtn.addEventListener('click', startScanning);
    startScanning();
  </script>
</body>
</html>
