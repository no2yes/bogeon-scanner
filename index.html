<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약품 바코드 스캔</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #666; }
  #reader { width: 100%; max-width: 420px; margin: 16px auto; border-radius: 10px; overflow: hidden; }
  #result { margin-top: 16px; padding: 16px; background: #fff; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; word-break: break-all; }
  #status { font-size: 13px; color: #666; margin-top: 8px; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #2F6F5E; color: #fff; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>약품 바코드 스캔</h1>
  <p id="status">카메라 권한을 요청합니다...</p>
  <div id="reader"></div>
  <div id="result">인식된 바코드가 여기 표시됩니다.</div>
  <button id="restart" style="display:none;">다시 스캔</button>

  <script>
    // ▼▼ 이 줄만 실제 배포된 Apps Script 웹 앱 URL로 바꿔주세요 (.../exec 로 끝나는 주소) ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwcCiLuaqezDOS_xqC6z022gsk9vLs-YfI0WQNG0xRW2-7GfUJSuhCwSHYAYMIvpk99vA/exec';

    var statusEl = document.getElementById('status');
    var resultEl = document.getElementById('result');
    var restartBtn = document.getElementById('restart');
    var html5QrCode;

    function sendToSheet(code, format) {
      statusEl.textContent = '저장 중...';
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ barcode: code, format: format })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.ok) {
          statusEl.textContent = '저장 완료! 이 창을 닫으셔도 됩니다.';
        } else {
          statusEl.textContent = '저장 실패: ' + (data && data.error ? data.error : '알 수 없는 오류');
        }
      })
      .catch(function (err) {
        statusEl.textContent = '전송 실패: ' + err;
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      resultEl.textContent = '인식됨: ' + decodedText;
      var formatName = decodedResult.result.format.formatName;
      html5QrCode.stop().then(function () {
        restartBtn.style.display = 'inline-block';
        sendToSheet(decodedText, formatName);
      });
    }

    function startScanning() {
      restartBtn.style.display = 'none';
      resultEl.textContent = '인식된 바코드가 여기 표시됩니다.';
      html5QrCode = new Html5Qrcode('reader');
      var config = {
        fps: 10,
        qrbox: { width: 250, height: 120 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128
        ]
      };
      html5QrCode.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess
      ).then(function () {
        statusEl.textContent = '카메라 작동 중 — 바코드를 화면에 비춰주세요.';
      }).catch(function (err) {
        statusEl.textContent = '카메라 접근 실패: ' + err;
      });
    }

    restartBtn.addEventListener('click', startScanning);
    startScanning();
  </script>
</body>
</html>
